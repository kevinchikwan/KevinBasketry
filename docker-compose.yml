# Local development infrastructure (DESIGN.md Section 7).
#
#   Kafka and Redis:  docker compose up -d --wait
#   ... and Postgres: docker compose --profile postgres up -d --wait
#   Stop, keep data:  docker compose down
#   Wipe all data:    docker compose down -v
#
# Kafka and Postgres both keep their data in named volumes, so they are kept or
# wiped together: "down" keeps both, "down -v" deletes both (also the Postgres
# volume when the profile is off). Redis keeps nothing: it only mirrors stock
# counts that inventory-service reloads from its database, and caches listings. Services on in-memory
# H2 lose their data on every restart, so with H2 use "down -v"
# (services/README.md, "Restarting").
services:
  kafka:
    # Same 4.2 line as the client that Spring Boot 4.1 manages.
    image: apache/kafka:4.2.2
    ports:
      # Services run from IntelliJ connect to localhost:9092. Local machine only.
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      # Fixed, so the data in the volume stays valid across container restarts.
      CLUSTER_ID: XPDM2DjHS9-m2krFO15jlQ
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One node in KRaft mode: broker and controller together, no Zookeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST is for the machine running Docker; INTERNAL is for other containers
      # on this Compose network, which connect to kafka:29092.
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker, so every internal topic has one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Each service creates the topics it owns, with explicit partition counts.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # inventory-service's stock counters and catalog-service's listing cache
  # (DESIGN.md Section 2). Never the source of truth: no persistence and no
  # volume, so every start is empty, inventory-service reloads the counters from
  # its database and catalog-service refills the cache. A stale counter or page
  # can therefore never outlive a wiped database.
  redis:
    image: redis:8.10.3-alpine
    ports:
      # Services run from IntelliJ connect to localhost:6379. Local machine only.
      # Set BASKETRY_REDIS_PORT if 6379 is taken; inventory-service reads the same variable.
      - "127.0.0.1:${BASKETRY_REDIS_PORT:-6379}:6379"
    # No RDB snapshots, no AOF. volatile-lru evicts only keys with a TTL:
    # catalog-service's cached pages. inventory-service's counters and
    # catalog-service's version keys have none, so they are never evicted; if
    # memory ever fills with them alone, writes fail as with noeviction
    # (inventory-service then uses PostgreSQL alone) instead of silently
    # dropping a counter.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Only with --profile postgres. One container, one database and one user per
  # service (DESIGN.md Section 7); each service runs with its "postgres" profile.
  postgres:
    image: postgres:17.11-alpine
    profiles: [postgres]
    ports:
      # Local machine only. Set BASKETRY_POSTGRES_PORT if 5432 is taken; the
      # services read the same variable.
      - "127.0.0.1:${BASKETRY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only when the volume is empty: a change here needs "down -v".
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      # Local development defaults, not secrets. Override them through these
      # variables; a deployment never uses them (DESIGN.md Section 7).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BASKETRY_POSTGRES_ADMIN_PASSWORD:-local-dev-only-admin}
      BASKETRY_IDENTITY_DB_PASSWORD: ${BASKETRY_IDENTITY_DB_PASSWORD:-local-dev-only-identity}
      BASKETRY_MERCHANT_DB_PASSWORD: ${BASKETRY_MERCHANT_DB_PASSWORD:-local-dev-only-merchant}
      BASKETRY_PAYMENT_DB_PASSWORD: ${BASKETRY_PAYMENT_DB_PASSWORD:-local-dev-only-payment}
      BASKETRY_INVENTORY_DB_PASSWORD: ${BASKETRY_INVENTORY_DB_PASSWORD:-local-dev-only-inventory}
      BASKETRY_CATALOG_DB_PASSWORD: ${BASKETRY_CATALOG_DB_PASSWORD:-local-dev-only-catalog}
      BASKETRY_ORDER_DB_PASSWORD: ${BASKETRY_ORDER_DB_PASSWORD:-local-dev-only-orders}
      BASKETRY_PROMOTION_DB_PASSWORD: ${BASKETRY_PROMOTION_DB_PASSWORD:-local-dev-only-promotion}
    healthcheck:
      # Over TCP on purpose: while the init script runs, Postgres listens only on
      # its socket, so a socket check could pass before the databases exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U identity -d identity"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  kafka-data:
  postgres-data:
