# The default build: every test on H2, with an embedded Kafka broker and an
# in-memory fake of Redis. It needs no Docker; postgresTest (Testcontainers)
# is not run here.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Keep the test reports of a failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: services/*/build/reports/tests/
          retention-days: 7
