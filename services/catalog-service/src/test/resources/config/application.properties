# Merged over the main application.yml for every test. Tests run the stock-row
# relay directly, so its timer stays off unless a test class turns it on.
basketry.stock-rows.relay.enabled=false
# Tests call MerchantStatusService directly, so the merchant.status.changed
# listener stays off unless a test class turns it on. With it off, no test
# context ever reaches for a broker.
basketry.merchant-status.consumer.enabled=false
# The default run uses the in-memory fake cache (support/TestCacheConfig). The
# real Redis client is still built, so point it at a port where nothing listens:
# no test of the default run may ever reach a Redis left running on the
# developer's machine. postgresTest points it at its container instead.
spring.data.redis.host=127.0.0.1
spring.data.redis.port=1
# The internal API key catalog-service sends to the fake inventory-service. Not a secret.
basketry.internal.api-key=test-only-internal-key-not-a-secret-000
