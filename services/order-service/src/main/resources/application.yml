server:
  # Fixed port map in services/README.md.
  port: 8085
  tomcat:
    # Off, as by default; stated so nobody turns it on to debug checkout. It
    # would never log bodies, but its patterns can log headers.
    accesslog:
      enabled: false

spring:
  application:
    name: order-service

  # Default: in-memory H2 in PostgreSQL mode, emptied on every restart, and
  # kept while the service runs, even with no open connection (DB_CLOSE_DELAY;
  # LocalDatabaseTests). The "postgres" profile (application-postgres.yml)
  # keeps the data in PostgreSQL.
  datasource:
    url: jdbc:h2:mem:orders;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  # Flyway owns the schema; Hibernate only checks that the entities match it.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

  # Errors are returned as RFC 9457 problem details, never as stack traces.
  mvc:
    problemdetails:
      enabled: true
    # Never log request details (parameters, headers): set explicitly, so the
    # rule does not depend on a default. The checkout body is never logged at
    # all (DESIGN.md Section 2, order-service, the card number).
    log-request-details: false

  # As in identity-service and catalog-service: a number like 1.5 sent for a
  # whole-number field is a 400, never truncated, and a field takes only its own
  # JSON type: "5" for a number or 0 for a boolean is a 400, never converted.
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

  # The four request topics and order.succeeded / order.failed out (DESIGN.md
  # Section 5). Startup never waits for Kafka: the relay creates the topics on
  # its first publish.
  kafka:
    bootstrap-servers: ${BASKETRY_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # The six result listeners (DESIGN.md Section 5, order-service results).
    consumer:
      group-id: order-service
      # Results published before this service first started are still read.
      auto-offset-reset: earliest
      # The container commits after each record is applied, never before.
      enable-auto-commit: false
      # Applying a result may wait up to 5 s for the order's row lock; 50 records
      # stay well inside max.poll.interval.ms (5 minutes), the default 500 would not.
      max-poll-records: 50
      properties:
        # payment-service and inventory-service own the result topics and create
        # them on their first publish. Until then they are missing, which is normal;
        # this is how soon the consumer notices them (the client's default is 5 minutes).
        allow.auto.create.topics: false
        metadata.max.age.ms: 10000
        # Keeps the log readable while the broker is down.
        reconnect.backoff.max.ms: 10000
    listener:
      ack-mode: record
      concurrency: 1
      missing-topics-fatal: false
    # The relay and the dead-letter topics. A send either finishes or fails within these limits.
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    admin:
      # Startup never touches Kafka: our topics are created on first use.
      auto-create: false
      operation-timeout: 3s
      properties:
        request.timeout.ms: 3000
        default.api.timeout.ms: 3000

  # Two timers, the outbox relay and the saga timer, so a long pass of one never
  # holds up the other (as inventory-service's relay and reconciliation).
  task:
    scheduling:
      pool:
        size: 2

# The health endpoint only, with no details.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

basketry:
  cors:
    # Vite's default dev-server port. Widen this (comma-separated) once the Buyer,
    # Merchant and Admin apps exist (DESIGN.md Section 1).
    allowed-origins: http://localhost:5173
  identity:
    # identity-service: GET /accounts/{id}, the live buyer check at checkout.
    base-url: ${BASKETRY_IDENTITY_URL:http://localhost:8080}
    connect-timeout: 2s
    read-timeout: 5s
  catalog:
    # catalog-service: GET /internal/products, the re-validation of every line.
    base-url: ${BASKETRY_CATALOG_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
  merchant:
    # merchant-service: GET /internal/merchants, live status and commission rate.
    base-url: ${BASKETRY_MERCHANT_URL:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 5s
  internal:
    # Shared key sent to catalog-service's and merchant-service's /internal/**.
    # Never committed: comes from the environment (a Kubernetes Secret when
    # deployed), the same variable the other services read. Unset = a WARN at
    # startup and every checkout refused with 503; set = at least 32 characters.
    api-key: ${BASKETRY_INTERNAL_API_KEY:}
  order:
    # The key of the Idempotency-Key fingerprint (an HMAC, DESIGN.md Section 2).
    # Never committed. Unset = a WARN at startup and every checkout refused with
    # 503; set = at least 32 characters.
    fingerprint-key: ${BASKETRY_ORDER_FINGERPRINT_KEY:}
    # The saga timer (DESIGN.md Section 2, order-service, the timer).
    # A result not in by then counts as failed.
    saga-deadline: 2m
    timer-interval: 5s
    # After a start, the timer waits this long, so results still queued in Kafka are read first.
    startup-grace: 60s
    timer:
      enabled: true
      batch-size: 100
    compensation:
      # An unconfirmed refund or release is sent again after this, at most max-resends
      # times; then its leg is STUCK and the order needs attention.
      resend-interval: 1m
      max-resends: 3
  # The six result listeners and their dead-letter topics (DESIGN.md Section 5).
  order-results:
    consumer:
      enabled: true
    # Each result topic's dead-letter topic is its name plus ".order-service.DLT", created here on first use.
    dead-letter-partitions: 3
    replication-factor: 1
    # After a database failure (a row-lock timeout included): wait 1s, 2s, 4s ... up to 60s, with no limit.
    retry-initial: 1s
    retry-max: 60s
  # The request topics, order.succeeded and order.failed, and the relay that publishes the outbox rows.
  outbox:
    # Fixed: changing the count later moves keys between partitions and breaks per-order order.
    partitions: 3
    replication-factor: 1
    # Longer than max.block.ms plus delivery.timeout.ms, so the producer gives the answer first.
    send-timeout: 16s
    relay:
      enabled: true
      interval: 1s
      batch-size: 100
      # After a failed pass: wait 1s, 2s, 4s ... up to 60s. A success resets it.
      backoff-initial: 1s
      backoff-max: 60s
