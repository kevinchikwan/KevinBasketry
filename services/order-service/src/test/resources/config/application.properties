# Merged over the main application.yml for every test. Tests run the relay
# directly, so its timer stays off unless a test class turns it on.
basketry.outbox.relay.enabled=false
# Tests call SagaService and SagaTimer directly, so the result listeners and the
# timer's schedule stay off unless a test class turns them on.
basketry.order-results.consumer.enabled=false
basketry.order.timer.enabled=false
# No test of the default run may reach a broker left running on the developer's
# machine: the Kafka tests start an embedded one and point at it instead.
spring.kafka.bootstrap-servers=127.0.0.1:1
# Not secrets.
basketry.internal.api-key=test-only-internal-key-not-a-secret-000
basketry.order.fingerprint-key=test-only-fingerprint-key-not-a-secret
