# Merged over the main application.yml for every test.
# The internal API key callers present on /internal/** in tests. Not a secret.
basketry.internal.api-key=test-only-internal-key-not-a-secret-000
# Tests call CouponUsageService directly, so the order.succeeded listener stays
# off unless a test class turns it on.
basketry.coupon-usage.consumer.enabled=false
# No test of the default run may reach a broker left running on the developer's
# machine: the Kafka tests start an embedded one and point at it instead.
spring.kafka.bootstrap-servers=127.0.0.1:1
