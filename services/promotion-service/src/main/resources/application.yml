server:
  # Fixed port map in services/README.md (checked by ApplicationFileTests).
  port: 8086
  tomcat:
    # Off, as by default; stated so nobody turns it on to debug pricing. It
    # would never log bodies, but its patterns can log headers (the internal key).
    accesslog:
      enabled: false

spring:
  application:
    name: promotion-service

  # Default: in-memory H2 in PostgreSQL mode, emptied on every restart, and
  # kept while the service runs, even with no open connection (DB_CLOSE_DELAY;
  # LocalDatabaseTests). The "postgres" profile (application-postgres.yml)
  # keeps the data in PostgreSQL.
  datasource:
    url: jdbc:h2:mem:promotion;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  # Flyway owns the schema; Hibernate only checks that the entities match it.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

  # Errors are returned as RFC 9457 problem details, never as stack traces.
  mvc:
    problemdetails:
      enabled: true
    # Never log request details (parameters, headers: the internal key, a bearer token): set
    # explicitly, so the rule does not depend on a default. The request object
    # masks the coupon code and the subtotals (PriceRequest).
    log-request-details: false

  # As in order-service: a number like 1.5 sent for a whole-number field is a
  # 400, never truncated, and a field takes only its own JSON type: "5" for a
  # number is a 400, never converted. A repeated field and anything after the
  # body are refused too (StrictJsonConfig).
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

  # order.succeeded in, for the usage count, and its dead-letter topic out
  # (DESIGN.md Section 5, promotion-service). Startup never waits for Kafka.
  kafka:
    bootstrap-servers: ${BASKETRY_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: promotion-service
      # Orders that succeeded before this service first started are still counted.
      auto-offset-reset: earliest
      # The container commits after each record is applied, never before.
      enable-auto-commit: false
      max-poll-records: 50
      # Bytes, decoded by OrderSucceededParser: StringDeserializer would turn a
      # value that is not UTF-8 into replacement characters instead of refusing
      # it, and the dead letter keeps the key and the value byte for byte.
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        # order-service owns order.succeeded and creates it on its first publish.
        # Until then it is missing, which is normal; this is how soon the consumer
        # notices it (the client's default is 5 minutes).
        allow.auto.create.topics: false
        metadata.max.age.ms: 10000
        # Keeps the log readable while the broker is down.
        reconnect.backoff.max.ms: 10000
    listener:
      ack-mode: record
      concurrency: 1
      missing-topics-fatal: false
    # Only the dead-letter topic: the original key and value, as bytes.
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    admin:
      # Startup never touches Kafka: the dead-letter topic is created on first use.
      auto-create: false
      operation-timeout: 3s
      properties:
        request.timeout.ms: 3000
        default.api.timeout.ms: 3000

# The health endpoint only, with no details (no database or disk information).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

basketry:
  internal:
    # Shared key order-service presents on /internal/**. Never committed: comes
    # from the environment (a Kubernetes Secret when deployed), the same variable
    # the other services read. Unset = a WARN at startup and every internal call
    # refused (401); set = at least 32 characters.
    api-key: ${BASKETRY_INTERNAL_API_KEY:}
  identity:
    # identity-service's JWKS, for verifying the bearer tokens of the coupon
    # endpoints (DESIGN.md Section 2, Tokens).
    base-url: ${BASKETRY_IDENTITY_URL:http://localhost:8080}
    connect-timeout: 2s
    read-timeout: 5s
  cors:
    # Vite's default dev-server port. Widen this (comma-separated) once the
    # Merchant portal and the Admin console exist (DESIGN.md Section 1).
    allowed-origins: http://localhost:5173
  # The order.succeeded listener and its dead-letter topic (DESIGN.md Section 5).
  coupon-usage:
    consumer:
      enabled: true
    # order.succeeded.promotion-service.DLT, created here on first use.
    dead-letter-partitions: 3
    replication-factor: 1
    # After a database failure: wait 1s, 2s, 4s ... up to 60s, with no limit.
    retry-initial: 1s
    retry-max: 60s
