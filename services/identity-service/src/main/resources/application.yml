spring:
  application:
    name: identity-service

  # Default: in-memory H2 in PostgreSQL mode, emptied on every restart, and
  # kept while the service runs, even with no open connection (DB_CLOSE_DELAY;
  # LocalDatabaseTests). The "postgres" profile (application-postgres.yml)
  # keeps the data in PostgreSQL.
  datasource:
    url: jdbc:h2:mem:identity;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  # Flyway owns the schema; Hibernate only checks that the entities match it.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

  # A number like 1.5 sent for an integer field is a 400, not silently
  # truncated (it would link merchantId 1 instead of rejecting the request).
  # A boolean or number field takes only that JSON type: "false" or 0 for a
  # boolean and "42" for a number are 400s, never converted.
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

  # merchant.status.changed (DESIGN.md Section 5). Startup never waits for Kafka:
  # the listener connects in the background and keeps trying.
  kafka:
    bootstrap-servers: ${BASKETRY_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: identity-service
      # Events published before this service first started are still read.
      auto-offset-reset: earliest
      # The container commits after each record is applied, never before.
      enable-auto-commit: false
      properties:
        # merchant-service owns the topic, and creates it on the first status
        # change. Until then it is missing, which is normal; this is how soon
        # the consumer notices it (the client's default is 5 minutes).
        allow.auto.create.topics: false
        metadata.max.age.ms: 10000
        # Keeps the log readable while the broker is down.
        reconnect.backoff.max.ms: 10000
    listener:
      ack-mode: record
      concurrency: 1
      missing-topics-fatal: false
    # Only for the dead-letter topic. A send either finishes or fails within these limits.
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    admin:
      # Startup never touches Kafka: the dead-letter topic is created on first use.
      auto-create: false
      operation-timeout: 3s
      properties:
        request.timeout.ms: 3000
        default.api.timeout.ms: 3000

  # Errors are returned as RFC 9457 problem details, never as stack traces.
  mvc:
    problemdetails:
      enabled: true

basketry:
  merchant-status:
    consumer:
      enabled: true
    topic: merchant.status.changed
    dead-letter-topic: merchant.status.changed.DLT
    dead-letter-partitions: 3
    replication-factor: 1
    # After a database failure: wait 1s, 2s, 4s ... up to 60s, with no limit on attempts.
    retry-initial: 1s
    retry-max: 60s
  internal:
    # Shared key for /internal/** (merchant-service -> merchant-link). Never
    # committed: comes from the environment (a Kubernetes Secret when deployed).
    # Unset = every /internal/** call is refused; set = at least 32 characters.
    api-key: ${BASKETRY_INTERNAL_API_KEY:}
  cors:
    # Vite's default dev-server port. Widen this (comma-separated) once the
    # real front-end URLs exist (DESIGN.md Section 1).
    allowed-origins: http://localhost:5173
