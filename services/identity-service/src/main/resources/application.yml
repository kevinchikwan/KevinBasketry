spring:
  application:
    name: identity-service

  # Early development: in-memory H2 in PostgreSQL mode (DESIGN.md Section 7).
  # Swapped for Postgres in the deployed version.
  datasource:
    url: jdbc:h2:mem:identity;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

  # Flyway owns the schema; Hibernate only checks that the entities match it.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

  # A number like 1.5 sent for an integer field is a 400, not silently
  # truncated (it would link merchantId 1 instead of rejecting the request).
  # A boolean or number field takes only that JSON type: "false" or 0 for a
  # boolean and "42" for a number are 400s, never converted.
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

  # Errors are returned as RFC 9457 problem details, never as stack traces.
  mvc:
    problemdetails:
      enabled: true

basketry:
  internal:
    # Shared key for /internal/** (merchant-service -> merchant-link). Never
    # committed: comes from the environment (a Kubernetes Secret when deployed).
    # Unset = every /internal/** call is refused; set = at least 32 characters.
    api-key: ${BASKETRY_INTERNAL_API_KEY:}
  cors:
    # Vite's default dev-server port. Widen this (comma-separated) once the
    # real front-end URLs exist (DESIGN.md Section 1).
    allowed-origins: http://localhost:5173
