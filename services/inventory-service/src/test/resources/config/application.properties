# Merged over the main application.yml for every test. Tests call the
# reconciler directly, so its startup run and timer stay off unless a test class
# turns them on.
basketry.stock-counter.reconciliation.enabled=false
# The default run uses the in-memory fake counter (support/TestStockCounterConfig).
# The real Redis client is still built, so point it at a port where nothing
# listens: no test of the default run may ever reach a Redis left running on the
# developer's machine. postgresTest points it at its container instead.
spring.data.redis.host=127.0.0.1
spring.data.redis.port=1
# The internal API key callers present on /internal/** in tests. Not a secret.
basketry.internal.api-key=test-only-internal-key-not-a-secret-000
