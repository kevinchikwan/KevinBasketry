server:
  # Fixed port map in services/README.md.
  port: 8083

spring:
  application:
    name: inventory-service

  # Default: in-memory H2 in PostgreSQL mode, emptied on every restart. The
  # "postgres" profile (application-postgres.yml) keeps the data in PostgreSQL.
  datasource:
    url: jdbc:h2:mem:inventory;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

  # Flyway owns the schema; Hibernate only checks that the entities match it.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

  # Errors are returned as RFC 9457 problem details, never as stack traces.
  mvc:
    problemdetails:
      enabled: true

  # As in identity-service: a number like 1.5 sent for a whole-number field is a
  # 400, never truncated, and a number field takes only a JSON number: "5" or
  # true for a delta is a 400, never converted.
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

  # The stock counters (DESIGN.md Section 2). Redis is never the source of truth,
  # so it is never needed: when it is down or slow, reservations go to the
  # PostgreSQL gate alone. Short timeouts keep a slow Redis from holding up a
  # reservation; RedisClientConfig makes commands fail at once while disconnected.
  data:
    redis:
      host: ${BASKETRY_REDIS_HOST:localhost}
      port: ${BASKETRY_REDIS_PORT:6379}
      # Empty locally (Compose's Redis listens on 127.0.0.1 only). A deployment
      # sets it from a Kubernetes Secret (DESIGN.md Section 7).
      password: ${BASKETRY_REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms

# The health endpoint only, with no details. Redis is not part of health at all,
# so an unreachable Redis never makes the pod unready (DESIGN.md Section 2).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

basketry:
  identity:
    # identity-service's JWKS, for verifying bearer tokens (DESIGN.md Section 2, Tokens).
    base-url: ${BASKETRY_IDENTITY_URL:http://localhost:8080}
    connect-timeout: 2s
    read-timeout: 5s
  internal:
    # Shared key that catalog-service will present on /internal/**. Never
    # committed: comes from the environment (a Kubernetes Secret when deployed),
    # the same variable identity-service reads. Unset = every /internal/**
    # request is refused; set = at least 32 characters.
    api-key: ${BASKETRY_INTERNAL_API_KEY:}
  cors:
    # Vite's default dev-server port. Widen this (comma-separated) once the
    # Merchant portal exists (DESIGN.md Section 1).
    allowed-origins: http://localhost:5173
  stock-counter:
    # After a Redis failure, reservations skip Redis for this long instead of
    # waiting for a timeout every time.
    skip-after-failure: 10s
    reconciliation:
      # At startup (in the background) and then periodically, every counter is
      # overwritten from PostgreSQL.
      enabled: true
      interval: 5m
      page-size: 500
