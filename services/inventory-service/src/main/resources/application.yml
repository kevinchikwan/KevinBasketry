server:
  # Fixed port map in services/README.md.
  port: 8083

spring:
  application:
    name: inventory-service

  # Default: in-memory H2 in PostgreSQL mode, emptied on every restart. The
  # "postgres" profile (application-postgres.yml) keeps the data in PostgreSQL.
  datasource:
    url: jdbc:h2:mem:inventory;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

  # Flyway owns the schema; Hibernate only checks that the entities match it.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

  # The stock counters (DESIGN.md Section 2). Redis is never the source of truth,
  # so it is never needed: when it is down or slow, reservations go to the
  # PostgreSQL gate alone. Short timeouts keep a slow Redis from holding up a
  # reservation; RedisClientConfig makes commands fail at once while disconnected.
  data:
    redis:
      host: ${BASKETRY_REDIS_HOST:localhost}
      port: ${BASKETRY_REDIS_PORT:6379}
      # Empty locally (Compose's Redis listens on 127.0.0.1 only). A deployment
      # sets it from a Kubernetes Secret (DESIGN.md Section 7).
      password: ${BASKETRY_REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms

# The health endpoint only, with no details. Redis is not part of health at all,
# so an unreachable Redis never makes the pod unready (DESIGN.md Section 2).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

basketry:
  stock-counter:
    # After a Redis failure, reservations skip Redis for this long instead of
    # waiting for a timeout every time.
    skip-after-failure: 10s
    reconciliation:
      # At startup (in the background) and then periodically, every counter is
      # overwritten from PostgreSQL.
      enabled: true
      interval: 5m
      page-size: 500
